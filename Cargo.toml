[workspace]
resolver = "2"
members = ["crates/phys", "crates/scene", "crates/world","crates/jbeam", "crates/app", "crates/game"]

[profile.release]
opt-level = 3
debug = false
lto = "thin"

# Dependencies (Bevy) optimised and without debug info even in dev builds: much faster and far smaller.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 2

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(earthsim_check_win)'] }
