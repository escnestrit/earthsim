name: build-windows
# Builds the game on GitHub's Windows machines, so nothing has to be installed locally.
# Download the artifact "earthsim-windows" from the run page (a zip with earthsim.exe).
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Bevy front end (main exe) and the original OpenGL front end (kept as a fallback)
      - name: Build earthsim.exe (Bevy) and earthsim-classic.exe
        run: cargo build --release -p earthsim-game -p earthsim
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp target/release/earthsim-bevy.exe dist/earthsim.exe
          cp target/release/earthsim.exe dist/earthsim-classic.exe
          cp README.md dist/
          cp -r dist_files/* dist/
      - uses: actions/upload-artifact@v4
        with:
          name: earthsim-windows
          path: dist/
      - name: Tests (physics, scene, streaming, game logic, jbeam, input mapping)
        continue-on-error: true
        run: cargo test --release --workspace
