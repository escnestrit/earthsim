name: build-windows
# Builds earthsim.exe on GitHub's Windows machines, so nothing has to be installed locally.
# Use: push this folder to a GitHub repository, open the "Actions" tab, pick "build-windows" (or press
# "Run workflow"), wait ~5 minutes, download the artifact "earthsim-windows" (a zip with earthsim.exe).
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The exe is built first and delivered even if a test fails (tests include timing-based streaming tests).
      - name: Build earthsim.exe
        run: cargo build --release -p earthsim
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp target/release/earthsim.exe dist/
          cp README.md dist/
          cp dist_files/*.bat dist/
      - uses: actions/upload-artifact@v4
        with:
          name: earthsim-windows
          path: dist/
      - name: Tests (physics, scene, streaming, game logic)
        continue-on-error: true
        run: cargo test --release --workspace --exclude earthsim-game
